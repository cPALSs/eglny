  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") { document.documentElement.setAttribute("data-theme", t); document.documentElement.setAttribute("data-ls-scheme", t); }
      } catch (_) {}

<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>Activities</h1>
        <p>Programming and things to do at the festival.</p>
      </section>
      <section>
        <h2>Star of Spring Mini-Pageant</h2>
        <p>Princess (ages 6–9) and Junior Princess (ages 10–13). Tentative Saturday or Sunday, February 13 or 14, 2027 · Elk Grove Regional Park. Hosted by Miss &amp; Miss Teen Vietnam Northern California.</p>
        <p><a href="https://tally.so/r/dbb7po">Register on Tally</a></p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/vendor/lsds/lsds.iife.js"></script>
  <script src="../doc-scroll.js"></script>
  <script src="../site.js"></script>
  <script>
    (async function () {
      const {
        initPageShell,
        loadSiteData,
        mountFooter,
        renderActivitySignupsPage,
        initProgrammingFlierShare,
        initDocToc,
        setPageTitle,
        escapeHtml,
        revealPage,
      } = window.EglnySite;
      initPageShell("activities");
      try {
        const site = await loadSiteData();
        const page = site.activities;
        setPageTitle(site, page?.headline ?? "Activities");
        document.querySelector('meta[name="description"]').setAttribute(
          "content",
          page?.metaDescription ??
            "Activities at Elk Grove Lunar New Year Tết 2027 — programming and things to do at the festival.",
        );
        document.getElementById("main").innerHTML = renderActivitySignupsPage(page);
        initDocToc();
        if (typeof initProgrammingFlierShare === "function") initProgrammingFlierShare();
        mountFooter(site);
        if (typeof revealPage === "function") revealPage();
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
        if (typeof revealPage === "function") revealPage();
      }
    })();
  </script>
</body>
</html>
