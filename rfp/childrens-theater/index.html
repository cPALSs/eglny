<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6SFT9M0ME"></script>
  <script src="../../analytics.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Request for proposals: Children’s Theater producer for Elk Grove Toy Drive 2026 and Elk Grove Lunar New Year 2027. Proposals due Oct 17, 2026." />
  <link rel="canonical" href="https://eglny.com/rfp/childrens-theater/" />
  <title>RFP — Children’s Theater — Elk Grove Lunar New Year Tết</title>
  <script src="../../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="../../site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <p class="muted">Loading…</p>
  </main>
  <div id="site-footer"></div>
  <script src="../../doc-scroll.js"></script>
  <script src="../../site.js"></script>
  <script>
    (async function () {
      const { initPageShell, loadSiteData, loadJsonData, mountFooter, renderVendorRfpPage, initDocToc, setPageTitle, escapeHtml } =
        window.EglnySite;
      initPageShell("rfp");
      try {
        const [site, rfp] = await Promise.all([
          loadSiteData(),
          loadJsonData("data/rfp-childrens-theater.json"),
        ]);
        setPageTitle(site, rfp?.meta?.pageTitle ?? "RFP — Children’s Theater");
        if (rfp?.meta?.description) {
          document.querySelector('meta[name="description"]').setAttribute("content", rfp.meta.description);
        }
        document.getElementById("main").innerHTML = renderVendorRfpPage(rfp);
        initDocToc();
        mountFooter(site);
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
