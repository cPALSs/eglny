<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <style>
    html { background: #030d29; color-scheme: dark; }
    html[data-theme="light"] { background: #ffffff; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html[data-theme="auto"] { background: #ffffff; color-scheme: light; }
    }
    html.js:not(.is-hydrated) body { visibility: hidden; }
  </style>
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () { document.documentElement.classList.add("is-hydrated"); }, 3000);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Browse meals, drinks, and snacks from Elk Grove Lunar New Year Tết 2026 — search and filter by dietary needs." />
  <link rel="canonical" href="https://eglny.com/food-menu/" />
  <title>Food menu — Elk Grove Lunar New Year Tết</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="../site.css" />
  <link rel="stylesheet" href="../assets/menu-viewer/menu-viewer.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6SFT9M0ME"></script>
  <script src="../analytics.js"></script>
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--food-menu" id="main">
    <p class="muted">Loading…</p>
  </main>
  <div id="site-footer"></div>
  <script src="../site.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
