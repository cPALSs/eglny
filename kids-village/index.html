<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <style>
    html { background: #1a0806; color-scheme: dark; }
    html[data-theme="light"] { background: #ffffff; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html[data-theme="auto"] { background: #ffffff; color-scheme: light; }
    }
    html.js:not(.is-hydrated) body { visibility: hidden; }
  </style>
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () { document.documentElement.classList.add("is-hydrated"); }, 3000);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="description" content="Kids Village at Elk Grove Lunar New Year Tết — details soon." />
  <link rel="canonical" href="https://eglny.com/kids-village/" />
  <title>Kids Village — Elk Grove Lunar New Year Tết</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="../site.css" />
  <link rel="stylesheet" href="./feed.css" />
  <meta property="og:title" content="Kids Village — Elk Grove Lunar New Year Tết" />
  <meta property="og:description" content="Kids Village — details soon." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eglny.com/kids-village/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kids Village — Elk Grove Lunar New Year Tết" />
  <meta name="twitter:description" content="Kids Village — details soon." />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6SFT9M0ME"></script>
  <script src="../analytics.js"></script>
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--kids-village" id="main">
    <section class="hero">
      <h1>Kids Village <span class="kv-soon">Details soon!</span></h1>
    </section>

    <section class="kv-feed" aria-label="Feed the lion">
      <div class="kv-stage">
        <button type="button" class="kv-chevron kv-prev" id="kvPrev" aria-label="Previous lion">‹</button>
        <div class="kv-viewport" id="kvViewport">
          <div class="kv-track" id="kvTrack"></div>
        </div>
        <button type="button" class="kv-chevron kv-next" id="kvNext" aria-label="Next lion">›</button>
      </div>
      <div class="kv-dots" id="kvDots" role="tablist" aria-label="Lions"></div>
      <div class="kv-treats" id="kvTreats">
        <div class="kv-treats-row">
          <button type="button" class="kv-treat" data-treat="envelope" aria-label="Red envelope. Drag to the lion or tap to feed.">
            <span class="kv-treat-art" data-art="envelope"></span>
            <span class="kv-treat-label">Red envelope</span>
          </button>
          <button type="button" class="kv-treat" data-treat="cabbage" aria-label="Lettuce. Drag to the lion or tap to feed.">
            <span class="kv-treat-art" data-art="cabbage"></span>
            <span class="kv-treat-label">Lettuce</span>
          </button>
        </div>
        <p class="kv-hint" id="kvHint">Drag a treat into the lion’s mouth</p>
      </div>
    </section>

    <div class="kv-fly-layer" id="kvFlyLayer" aria-hidden="true"></div>
    <div class="kv-pop" id="kvPop" hidden aria-hidden="true">Yum!</div>
  </main>
  <div id="site-footer"></div>
  <script src="../site.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
