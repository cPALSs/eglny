<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <style>
    html { background: #030d29; color-scheme: dark; }
    html[data-theme="light"] { background: #ffffff; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html[data-theme="auto"] { background: #ffffff; color-scheme: light; }
    }
    html.js:not(.is-hydrated) body { visibility: hidden; }
  </style>
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () { document.documentElement.classList.add("is-hydrated"); }, 3000);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sponsor Elk Grove Lunar New Year Tết 2027 — Fund The Festival, sponsorship packet, and thank you to our 2026 partners." />
  <link rel="canonical" href="https://eglny.com/sponsorship/" />
  <title>Sponsorship — Elk Grove Lunar New Year Tết</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="../site.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6SFT9M0ME"></script>
  <script src="../analytics.js"></script>
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <p class="muted">Loading…</p>
  </main>
  <div id="site-footer"></div>
  <script src="../doc-scroll.js"></script>
  <script src="../site.js"></script>
  <script>
    (async function () {
      const {
        initPageShell,
        loadSiteData,
        loadJsonData,
        mountFooter,
        renderSponsorshipPage,
        initDocToc,
        setPageTitle,
        escapeHtml,
        revealPage,
      } = window.EglnySite;
      initPageShell("sponsorship");
      try {
        const [site, sponsorsData] = await Promise.all([
          loadSiteData(),
          loadJsonData("data/lny-2026-sponsors-display.json"),
        ]);
        setPageTitle(site, site.sponsorship?.headline ?? "Sponsorship");
        document.querySelector('meta[name="description"]').setAttribute(
          "content",
          "Sponsor Elk Grove Lunar New Year Tết 2027 — Fund The Festival, sponsorship packet, and thank you to our 2026 partners.",
        );
        document.getElementById("main").innerHTML = renderSponsorshipPage(site.sponsorship, sponsorsData);
        initDocToc();
        mountFooter(site);
        if (typeof revealPage === "function") revealPage();
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
        if (typeof revealPage === "function") revealPage();
      }
    })();
  </script>
</body>
</html>
