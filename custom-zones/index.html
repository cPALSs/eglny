<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <style>
    html { background: #030d29; color-scheme: dark; }
    html[data-theme="light"] { background: #ffffff; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html[data-theme="auto"] { background: #ffffff; color-scheme: light; }
    }
    html.js:not(.is-hydrated) body { visibility: hidden; }
  </style>
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () { document.documentElement.classList.add("is-hydrated"); }, 3000);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom Zones — Elk Grove Lunar New Year Tết</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="../site.css" />
  <meta name="description" content="Custom Zones at Elk Grove Lunar New Year Tết 2027 — your name on the map. Decorate your corner yourself or ask us to help bring it to life." />
  <link rel="canonical" href="https://eglny.com/custom-zones/" />
  <meta property="og:title" content="Custom Zones — Elk Grove Lunar New Year Tết" />
  <meta property="og:description" content="Custom Zones at Elk Grove Lunar New Year Tết 2027 — your name on the map. Decorate your corner yourself or ask us to help bring it to life." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eglny.com/custom-zones/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Custom Zones — Elk Grove Lunar New Year Tết" />
  <meta name="twitter:description" content="Custom Zones at Elk Grove Lunar New Year Tết 2027 — your name on the map. Decorate your corner yourself or ask us to help bring it to life." />
  <meta property="og:image" content="https://eglny.com/assets/og-default.jpg?v=1785296280" />
  <meta name="twitter:image" content="https://eglny.com/assets/og-default.jpg?v=1785296280" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6SFT9M0ME"></script>
  <script src="../analytics.js"></script>
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--host" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>Custom Zones</h1>
        <p>Your name on the map. Your community in the crowd.</p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../doc-scroll.js"></script>
  <script src="../site.js"></script>
  <script>
    (async function () {
      const {
        initPageShell,
        loadSiteData,
        loadSkuCatalog,
        mountFooter,
        renderHostActivations,
        initHostPageToc,
        initZoneCarousel,
        setPageTitle,
        escapeHtml,
        revealPage,
      } = window.EglnySite;
      initPageShell("host");
      try {
        const [site, catalog] = await Promise.all([loadSiteData(), loadSkuCatalog()]);
        const ha = site.hostActivations;
        setPageTitle(site, ha?.meta?.pageTitle ?? "Custom Zones");
        if (ha?.meta?.description) {
          document.querySelector('meta[name="description"]').setAttribute("content", ha.meta.description);
        }
        document.getElementById("main").innerHTML = renderHostActivations(site, catalog);
        initHostPageToc(ha?.apply, ha?.prompts);
        initZoneCarousel();
        mountFooter(site);
        if (typeof revealPage === "function") revealPage();
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
        if (typeof revealPage === "function") revealPage();
      }
    })();
  </script>
</body>
</html>
