<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6SFT9M0ME"></script>
  <script src="../analytics.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Booth vendor registration (aiming to open October 2026) and open RFPs for Children’s Village, Children’s Theater, and Tween/Teen Maker Spot at Elk Grove Lunar New Year Tết." />
  <link rel="canonical" href="https://eglny.com/vendors/" />
  <title>Vendors — Elk Grove Lunar New Year Tết</title>
  <script src="../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="../site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <p class="muted">Loading…</p>
  </main>
  <div id="site-footer"></div>
  <script src="../doc-scroll.js"></script>
  <script src="../site.js"></script>
  <script>
    (async function () {
      const { initPageShell, loadSiteData, loadJsonData, mountFooter, renderVendorsPage, setPageTitle, escapeHtml } =
        window.EglnySite;
      initPageShell("vendors");
      try {
        const [site, index] = await Promise.all([loadSiteData(), loadJsonData("data/vendors-index.json")]);
        setPageTitle(site, index?.meta?.pageTitle ?? "Vendors");
        if (index?.meta?.description) {
          document.querySelector('meta[name="description"]').setAttribute("content", index.meta.description);
        }
        document.getElementById("main").innerHTML = renderVendorsPage(index);
        mountFooter(site);
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
