  <title>Skills projects — Elk Grove Lunar New Year Tết</title>
  <script src="../../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="../../site.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>Skills projects</h1>
        <p>Scoped pro bono / skills-based roles — separate Idealist listings from Director seats.</p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../doc-scroll.js"></script>
  <script src="../../site.js"></script>
  <script>
    (async function () {
      const {
        initPageShell,
        loadSiteData,
        mountFooter,
        renderSkillsProjectsPage,
        initDocToc,
        setPageTitle,
        escapeHtml,
      } = window.EglnySite;
      initPageShell("team");
      try {
        const site = await loadSiteData();
        const block = site.teamPage?.skillsProjects;
        setPageTitle(site, block?.headline ?? block?.title ?? "Skills projects");
        document.getElementById("main").innerHTML = `
          <section class="hero">
            <h1>${escapeHtml(block?.headline ?? block?.title ?? "Skills projects")}</h1>
            <p class="hero-lead">${escapeHtml(block?.lead ?? "Scoped pro bono / skills-based roles for the 2027 festival.")}</p>
          </section>
          ${renderSkillsProjectsPage(site)}
        `;
        initDocToc();
        mountFooter(site);
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
