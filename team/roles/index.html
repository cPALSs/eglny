  <script src="../../clean-urls.js"></script>
  <script>
    (function () {
      try {
        var t = sessionStorage.getItem("eglny-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>

<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>Director roles</h1>
        <p>Traditional lane owners for the 2027 festival — one accountable director per role when possible.</p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../doc-scroll.js"></script>
  <script src="../../site.js"></script>
  <script>
    (async function () {
      const {
        initPageShell,
        loadSiteData,
        mountFooter,
        renderDirectorRolesPage,
        initDocToc,
        setPageTitle,
        escapeHtml,
      } = window.EglnySite;
      initPageShell("team");
      try {
        const site = await loadSiteData();
        setPageTitle(site, "Director roles");
        document.getElementById("main").innerHTML = `
          <section class="hero">
            <h1>Director roles</h1>
            <p class="hero-lead">Traditional festival lanes — still useful, listed here. For weekly calls, Discord, FAQ, and how we organize, see <a href="/team/">Team</a>.</p>
          </section>
          ${renderDirectorRolesPage(site)}
        `;
        initDocToc();
        mountFooter(site);
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
