<body>
  <div id="site-nav"></div>
  <main class="page-wrap page-wrap--doc" id="main">
    <div id="seo-prerender" class="seo-prerender">
      <section class="hero">
        <h1>History</h1>
        <p class="hero-lead">Greater Sacramento has hosted civic Tết (Lunar New Year) and Tết Trung Thu (Mid-Autumn Festival): a civic Hội Chợ Tết that later moved to Elk Grove Park, a civic moon and family fair, and separate calendars at Kim Quang Buddhist Temple and Vietnamese Martyrs Parish.</p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../doc-scroll.js"></script>
  <script src="../../site.js"></script>
  <script>
    (async function () {
      const {initPageShell,
        loadSiteData,
        loadJsonData,
        mountFooter,
        renderHistoryPage,
        initHistoryFilter,
        initHistoryLightbox,
        initHistoryCarousels,
        initMediaPlayers,
        initInstagramEmbeds,
        initDocToc,
        setPageTitle,
        escapeHtml, revealPage} = window.EglnySite;
      initPageShell("history");
      try {
        const site = await loadSiteData();
        const history = await loadJsonData("data/history.json");
        setPageTitle(site, "History");
        document.getElementById("main").innerHTML = renderHistoryPage(history);
        initDocToc();
        initHistoryFilter();
        initHistoryLightbox();
        initHistoryCarousels();
        initMediaPlayers();
        initInstagramEmbeds();
        mountFooter(site);
        if (typeof revealPage === "function") revealPage();
      } catch (err) {
        document.getElementById("main").innerHTML = `<p class="error-panel">${escapeHtml(err.message)}</p>`;
        if (typeof revealPage === "function") revealPage();
      }
    })();
  </script>
</body>
